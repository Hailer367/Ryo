[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.38"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1000000
via_ir = true
bytecode_hash = "ipfs"
cbor_metadata = true
fs_permissions = [{ access = "read", path = "./" }]

[fuzz]
runs = 256
seed = "0x52594f" # "RYO"

[invariant]
runs = 64
depth = 32
fail_on_revert = false

[rpc_endpoints]
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"

[profile.ci]
verbosity = 3
fuzz = { runs = 512 }
